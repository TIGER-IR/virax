<!doctype html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Virax</title>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  height:100vh;
  overflow:hidden;
  background:#080c20;
  color:#fff;
  font:13px Tahoma;
  user-select:none;
}

button,
input,
select{
  font:inherit;
  border:0;
  outline:0;
}

button{
  color:#fff;
  background:none;
  cursor:pointer;
}

input{
  user-select:text;
}

/* =========================
        AUTH
========================= */

#auth{
  height:100%;
  display:grid;
  place-items:center;
  padding:20px;
}

.box,
.modal{
  background:#151a36;
  border:1px solid #ffffff10;
  border-radius:24px;
}

.login{
  width:min(380px,100%);
  padding:25px;
  text-align:center;
}

.logo{
  font-size:30px;
  color:#8995ff;
  font-weight:bold;
  margin-bottom:15px;
}

.login p{
  color:#858ba2;
  font-size:11px;
  margin-bottom:15px;
}

.login input{
  width:100%;
  height:44px;
  padding:0 13px;
  border-radius:13px;
  background:#0e1330;
  color:#fff;
  margin-bottom:8px;
}

.primary{
  width:100%;
  height:44px;
  border-radius:13px;
  background:linear-gradient(
    135deg,
    #667eea,
    #7650a9
  );
  font-weight:bold;
}

/* =========================
          APP
========================= */

#app{
  display:none;
  height:100%;
}

.header{
  height:60px;
  padding:0 16px;
  display:flex;
  align-items:center;
  gap:9px;
  background:#111630;
}

.header-logo{
  font-size:22px;
  color:#8995ff;
}

.header-title{
  font-weight:bold;
  font-size:16px;
}

.search{
  height:58px;
  padding:7px 11px;
  display:flex;
  gap:8px;
}

.search input{
  flex:1;
  height:44px;
  border-radius:23px;
  padding:0 14px;
  background:#0e1330;
  color:#fff;
}

.admin{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#181e3b;
  border:1px solid #ffffff12;
}

.page{
  display:none;
  height:calc(100% - 118px);
  overflow:auto;
}

.page.active{
  display:block;
}

/* =========================
          CHAT LIST
========================= */

.chat{
  margin:9px 12px;
  padding:11px 13px;
  display:flex;
  align-items:center;
  border-radius:28px;
  background:#181e3bcc;
  border:1px solid #ffffff0d;
  cursor:pointer;
}

.chat:hover{
  background:#202747;
}

.avatar,
.pavatar,
.chatpic{
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:50%;
  background:
    linear-gradient(
      135deg,
      #667eea,
      #764ba2
    );
}

.avatar{
  width:50px;
  height:50px;
  margin-left:11px;
  font-size:21px;
  flex:none;
}

.avatar img,
.pavatar img,
.chatpic img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  flex:1;
  min-width:0;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.name{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.time{
  font-size:9px;
  color:#777d96;
  white-space:nowrap;
}

.msg{
  color:#8d93a8;
  font-size:11px;
  margin-top:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.empty{
  text-align:center;
  padding:100px 20px;
  color:#858ba2;
}

/* =========================
          PROFILE
========================= */

.profile{
  padding:18px 14px;
  text-align:center;
}

.pavatar{
  width:100px;
  height:100px;
  margin:auto;
  font-size:45px;
  cursor:pointer;
  box-shadow:
    0 10px 30px #667eea35;
}

.pname{
  font-size:20px;
  font-weight:bold;
  margin-top:12px;
}

.user{
  color:#8995ff;
  font-size:11px;
  margin-top:5px;
}

.online{
  color:#4ade80;
  font-size:10px;
  margin-top:5px;
}

.verify{
  display:inline-grid;
  place-items:center;
  width:17px;
  height:17px;
  margin-right:4px;
  border-radius:50%;
  background:#229ed9;
  font:bold 11px Arial;
  font-style:normal;
}

.card{
  max-width:500px;
  margin:18px auto 0;
  border-radius:21px;
  overflow:hidden;
  background:#181e3bcc;
  border:1px solid #ffffff0d;
  text-align:right;
}

.row{
  padding:12px 14px;
  border-bottom:1px solid #ffffff08;
  cursor:pointer;
}

.row:last-child{
  border:0;
}

.label{
  font-size:9px;
  color:#7d849d;
}

.value{
  margin-top:4px;
}

.logout{
  width:100%;
  max-width:500px;
  height:43px;
  margin:10px auto;
  border-radius:20px;
  background:#ef44441a;
  color:#ff7373;
}

/* =========================
          NAV
========================= */

.nav{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 20px);
  max-width:620px;
  height:68px;
  padding:5px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  background:#181e3bf5;
  border:1px solid #ffffff12;
  border-radius:38px;
  box-shadow:0 8px 25px #0005;
  backdrop-filter:blur(18px);
  z-index:4;
}

.nav button{
  border-radius:30px;
  font-size:9px;
  color:#747b94;
}

.nav .on{
  background:#ffffff12;
  color:#fff;
}

.nav b{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

/* =========================
          MODALS
========================= */

#edit,
#panel,
#userProfile{
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  align-items:center;
  justify-content:center;
  background:#000b;
  padding:15px;
}

.modal{
  width:min(430px,100%);
  padding:20px;
}

.modal h3{
  margin-bottom:15px;
}

.modal input,
.modal select{
  width:100%;
  height:42px;
  margin:5px 0;
  padding:0 12px;
  border-radius:12px;
  background:#0e1330;
  color:#fff;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:8px;
}

.danger{
  background:#ef444425;
  color:#ff7777;
}

.safe{
  background:#22c55e22;
  color:#66e89a;
}

.mbtn{
  width:100%;
  height:40px;
  border-radius:12px;
  margin-top:6px;
  background:#ffffff0b;
}

#file{
  display:none;
}

/* =========================
          TOAST
========================= */

.toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translate(-50%,20px);
  opacity:0;
  padding:10px 15px;
  border-radius:14px;
  background:#1d2445ee;
  font-size:11px;
  transition:.2s;
  z-index:30;
  pointer-events:none;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
          CHAT
========================= */

#savedChat{
  display:none;
  height:100%;
  position:relative;
  overflow:hidden;
}

#chatHead{
  height:58px;
  background:#111630;
  border-bottom:1px solid #ffffff08;
  display:flex;
  align-items:flex-start;
  padding:5px 12px;
  gap:10px;
}

.back{
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:22px;
  background:#ffffff08;
}

.chatpic{
  width:45px;
  height:45px;
  flex:none;
  font-size:20px;
}

.chatUser{
  min-width:0;
  cursor:pointer;
  padding-top:3px;
}

.chatUser b{
  display:block;
  font-size:13px;
  line-height:18px;
}

.chatUser span{
  display:block;
  color:#4ade80;
  font-size:9px;
  margin-top:2px;
}

#messages{
  height:calc(100% - 116px);
  overflow:auto;
  padding:8px 12px 12px;
}

.message{
  width:max-content;
  max-width:78%;
  margin:5px 0 5px auto;
  padding:9px 12px;
  border-radius:15px 15px 4px 15px;
  background:#667eea;
  word-break:break-word;
  user-select:text;
}

.message.other{
  margin:5px auto 5px 0;
  background:#181e3b;
  border-radius:
    15px 15px 15px 4px;
}

.meta{
  font-size:8px;
  opacity:.65;
  margin-top:4px;
  direction:ltr;
  text-align:right;
}

.sendbar{
  height:58px;
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:7px 11px;
  display:flex;
  gap:7px;
  background:#111630;
}

.sendbar input{
  flex:1;
  height:44px;
  border-radius:23px;
  padding:0 15px;
  background:#0e1330;
  color:#fff;
}

.send{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#667eea;
  font-size:18px;
}

/* =========================
          ONLINE
========================= */

.status-online{
  color:#4ade80 !important;
}

.status-offline{
  color:#777d96 !important;
}

/* =========================
          MOBILE
========================= */

@media(max-width:500px){

  .chat{
    margin:7px 9px;
  }

  .message{
    max-width:85%;
  }

  .modal{
    border-radius:20px;
  }

}

</style>

</head>

<script>

/* ==================================================
                VIRAX CLIENT
================================================== */

const $ =
  id => document.getElementById(id);


/* ==================================================
                STATE
================================================== */

let phone =
  localStorage.getItem("phone") || "";

let profile = null;

let currentChat = null;

let currentChatUser = null;

let socket = null;

let reconnecting = false;


/* ==================================================
                HELPERS
================================================== */

function escapeHTML(value){

  return String(value || "")
    .replace(
      /[&<>"']/g,
      char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      })[char]
    );

}


function verify(user){

  return user && user.verified
    ? '<i class="verify">✓</i>'
    : "";

}


function showToast(text){

  const toast =
    $("toast");

  toast.textContent =
    text;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    window.toastTimer
  );

  window.toastTimer =
    setTimeout(
      () => {
        toast.classList.remove(
          "show"
        );
      },
      2200
    );

}


function formatTime(timestamp){

  return new Date(timestamp)
    .toLocaleTimeString(
      "fa-IR",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* ==================================================
                  API
================================================== */

async function api(
  url,
  options = {}
){

  const response =
    await fetch(
      url,
      {
        ...options,

        headers:{
          "Content-Type":
            "application/json",

          ...(options.headers || {})
        }
      }
    );

  let data = {};

  try{

    data =
      await response.json();

  }catch{

  }

  if(!response.ok){

    throw new Error(
      data.error ||
      "خطایی رخ داد"
    );

  }

  return data;

}


/* ==================================================
                  LOGIN
================================================== */

async function login(){

  const input =
    $("phoneInput");

  const number =
    input.value
      .replace(/\D/g,"");

  if(
    !/^09\d{9}$/.test(number)
  ){

    showToast(
      "شماره موبایل معتبر نیست"
    );

    return;

  }

  try{

    const data =
      await api(
        "/api/login",
        {
          method:"POST",

          body:
            JSON.stringify({
              phone:number
            })
        }
      );

    phone =
      number;

    profile =
      data.user;

    localStorage.setItem(
      "phone",
      phone
    );

    $("auth").style.display =
      "none";

    $("app").style.display =
      "block";

    renderProfile();

    connectSocket();

    await loadChats();

  }
  catch(error){

    showToast(
      error.message
    );

  }

}


/* ==================================================
             SOCKET CONNECTION
================================================== */

function connectSocket(){

  if(socket){

    socket.disconnect();

  }

  socket =
    io({
      transports:[
        "websocket",
        "polling"
      ]
    });


  socket.on(
    "connect",
    () => {

      console.log(
        "Virax Socket connected"
      );

      socket.emit(
        "auth",
        phone
      );

    }
  );


  socket.on(
    "auth:error",
    data => {

      showToast(
        data.error ||
        "احراز هویت ناموفق بود"
      );

      logout();

    }
  );


  socket.on(
    "disconnect",
    () => {

      if(
        currentChat
      ){

        setChatStatus(
          false
        );

      }

    }
  );


  /* =========================
       MESSAGE RECEIVED
  ========================= */

  socket.on(
    "message",
    message => {

      /*
        اگر پیام مربوط به چت باز
        باشد، همان لحظه نمایش بده.
      */

      if(

        currentChat &&

        (
          (
            message.from === phone &&
            message.to === currentChat
          )
          ||
          (
            message.to === phone &&
            message.from === currentChat
          )
        )

      ){

        addMessage(
          message
        );

      }

      /*
        لیست گفتگوها
        هم به‌روزرسانی شود.
      */

      loadChats();

    }
  );


  /* =========================
        ONLINE / OFFLINE
  ========================= */

  socket.on(
    "presence",
    data => {

      if(
        currentChat === data.phone
      ){

        setChatStatus(
          data.online
        );

      }

      loadChats();

    }
  );


  /* =========================
        PROFILE UPDATE
  ========================= */

  socket.on(
    "profile:update",
    data => {

      if(
        data.phone === phone
      ){

        profile =
          data;

        renderProfile();

      }

      if(
        currentChat === data.phone
      ){

        updateChatHeader(
          data
        );

      }

      loadChats();

    }
  );


  /* =========================
             BAN
  ========================= */

  socket.on(
    "banned",
    () => {

      showToast(
        "حساب شما مسدود شد"
      );

      setTimeout(
        logout,
        700
      );

    }
  );


  /* =========================
        SERVER ERROR
  ========================= */

  socket.on(
    "error:msg",
    data => {

      showToast(
        data.error ||
        "خطا در ارسال پیام"
      );

    }
  );

}

async function loadChats(){

  try{

    const users =
      await api(
        "/api/users"
      );

    const container =
      $("chats");

    let html = `

      <div
        class="chat"
        onclick="openSavedMessages()"
      >

        <div class="avatar">
          🔖
        </div>

        <div class="info">

          <div class="top">

            <b class="name">
              پیام‌های ذخیره‌شده
            </b>

            <span class="time">
              شخصی
            </span>

          </div>

          <div class="msg">
            پیام‌های ذخیره‌شده شما
          </div>

        </div>

      </div>

    `;


    users
      .filter(
        user =>
          user.phone !== phone
      )
      .forEach(
        user => {

          html += `

            <div
              class="chat"
              data-phone="${escapeHTML(user.phone)}"
              onclick="openChat('${escapeHTML(user.phone)}')"
            >

              <div class="avatar">

                ${
                  user.photo

                    : "👤"
                }

              </div>

              <div class="info">

                <div class="top">

                  <b class="name">

                    ${escapeHTML(
                      user.name
                    )}

                    ${verify(user)}

                  </b>

                  <span
                    class="time ${
                      user.online
                        ? "status-online"
                        : "status-offline"
                    }"
                  >

                    ${
                      user.online
                        ? "آنلاین"
                        : "آفلاین"
                    }

                  </span>

                </div>

                <div class="msg">

                  ${
                    user.user
                      ? "@" +
                        escapeHTML(
                          user.user
                        )
                      : "آیدی انتخاب نشده"
                  }

                </div>

              </div>

            </div>

          `;

        }
      );


    if(
      users.filter(
        user =>
          user.phone !== phone
      ).length === 0
    ){

      html += `

        <div class="empty">

          👥

          <br><br>

          هنوز کاربر دیگری
          ثبت‌نام نکرده است.

        </div>

      `;

    }


    container.innerHTML =
      html;

  }
  catch(error){

    console.error(
      error
    );

  }

}

async function loadMessages(){

  if(!currentChat){

    return;

  }

  try{

    const messages =
      await api(
        "/api/messages/" +
        encodeURIComponent(
          currentChat
        ) +
        "?me=" +

    scrollMessages();

  catch(error){

    );

/* ==================================================
             ADD MESSAGE
================================================== */

function addMessage(
  message
){

  /*
    جلوگیری از دوباره نمایش دادن پیام
  */

  if(
    document.querySelector(
      `[data-message-id="${message.id}"]`
    )
  ){

    return;

  }


  const element =
    document.createElement(
      "div"
    );


  element.className =
    "message" +
    (
      message.from !== phone
        ? " other"
        : ""
    );


  element.dataset.messageId =
    message.id;


  element.innerHTML = `

    ${escapeHTML(
      message.text
    )}

    <div class="meta">

      ${formatTime(
        message.time
      )}

    </div>

  `;


  $("messages")
    .appendChild(
      element
    );


  scrollMessages();

}


/* ==================================================
             SCROLL
================================================== */

function scrollMessages(){

  const box =
    $("messages");

  box.scrollTop =
    box.scrollHeight;

}


/* ==================================================
              SEND MESSAGE
================================================== */

function sendMessage(){

  const input =
    $("messageInput");

  const text =
    input.value.trim();


  if(!text){

    return;

  }


  /*
    پیام ذخیره‌شده
  */

  if(!currentChat){

    const saved =
      JSON.parse(
        localStorage.getItem(
          "virax_saved"
        ) || "[]"
      );


    saved.push({

      id:
        Date.now(),

      text,

      time:
        Date.now()

    });


    localStorage.setItem(
      "virax_saved",
      JSON.stringify(
        saved
      )
    );


    input.value =
      "";

    loadSavedMessages();

    return;

  }


  /*
    چک اتصال
  */

  if(
    !socket ||
    !socket.connected
  ){

    showToast(
      "اتصال به سرور برقرار نیست"
    );

    return;

  }


  /*
    ارسال واقعی
    از طریق Socket.IO
  */

  socket.emit(
    "send",
    {

      to:
        currentChat,

      text

    }
  );


  input.value =
    "";

}


/* ==================================================
          ENTER TO SEND
================================================== */

$("messageInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* ==================================================
          SAVED MESSAGES
================================================== */

function loadSavedMessages(){

  const saved =
    JSON.parse(
      localStorage.getItem(
        "virax_saved"
      ) || "[]"
    );


  $("messages").innerHTML =
    "";


  saved.forEach(
    message => {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "message";


      element.innerHTML = `

        ${escapeHTML(
          message.text
        )}

        <div class="meta">

          ${formatTime(
            message.time
          )}

        </div>

      `;


      $("messages")
        .appendChild(
          element
        );

    }
  );


  scrollMessages();

}

async function saveProfile(){

  const name =
    $("ename")
      .value
      .trim() ||
    "کاربر Virax";


  const user =
    $("euser")
      .value
      .trim()
      .replace(/^@/,"")

      .toLowerCase();


  if(!user){

    showToast(
      "نام کاربری را وارد کنید"
    );

    return;

  }


  try{

    const data =
      await api(
        "/api/profile",
        {

          method:"POST",

          body:
            JSON.stringify({

              phone,

              name,

              user,

              photo:
                profile.photo || ""

            })

        }
      );


    profile =
      data.user;


    $("edit").style.display =
      "none";


    renderProfile();

    loadChats();

    showToast(
      "پروفایل ذخیره شد"
    );

  catch(error){

      error.message
    );

  }

/* ==================================================
              PROFILE PHOTO
================================================== */

function pickPhoto(){

  $("file").click();

}


$("file")
  .addEventListener(
    "change",
    event => {

      const file =
        event.target.files[0];


      if(!file){

        return;

      }


      if(
        file.size >
        3 * 1024 * 1024
      ){

        showToast(
          "حجم تصویر باید کمتر از ۳ مگابایت باشد"
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        async () => {

          try{

            const data =
              await api(
                "/api/profile",
                {

                  method:"POST",

                  body:
                    JSON.stringify({

                      phone,

                      name:
                        profile.name,

                      user:
                        profile.user,

                      photo:
                        reader.result

                    })

                }
              );


            profile =
              data.user;


            renderProfile();

            loadChats();


            showToast(
              "تصویر پروفایل تغییر کرد"
            );

          }
          catch(error){

            showToast(
              error.message
            );

          }

        };


      reader.readAsDataURL(
        file
      );

    }
  );

/* ==================================================
             MODERATION
================================================== */

async function moderation(
  action
){

  let target =
    $("target")
      .value
      .trim()
      .replace(/^@/,"");


  /*
    اگر شماره نیست،
    username را پیدا می‌کنیم.
  */

  if(
    !/^09\d{9}$/.test(
      target
    )
  ){

    try{

      const users =
        await api(
          "/api/users?q=" +
          encodeURIComponent(
            target
          )
        );


      const found =
        users.find(
          user =>
            (
              user.user || ""
            ).toLowerCase() ===
            target.toLowerCase()
        );


      if(!found){

        showToast(
          "کاربر پیدا نشد"
        );

        return;

      }


      target =
        found.phone;

    }
    catch(error){

      showToast(
        error.message
      );

      return;

    }

  }


  try{

    await api(
      "/api/moderation",
      {

        method:"POST",

        body:
          JSON.stringify({

            actor:
              phone,

            target,

            action,

            days:
              Number(
                $("days").value
              )

          })

      }
    );


    showToast(
      "عملیات با موفقیت انجام شد"
    );


    loadChats();

  }
  catch(error){

    showToast(
      error.message
    );

  }

}
