<!doctype html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Virax Messenger</title>

<style>

* {
    box-sizing:border-box;
    margin:0;
    -webkit-tap-highlight-color:transparent;
}

body {
    height:100vh;
    overflow:hidden;
    background:#080c20;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

button,
input {
    border:0;
    outline:0;
    font:inherit;
}

button {
    color:#fff;
    background:none;
    cursor:pointer;
}

input {
    color:#fff;
    background:#0e1330;
    padding:0 14px;
}

.hidden {
    display:none!important;
}

/* AUTH */

#auth {
    height:100%;
    display:grid;
    place-items:center;
    padding:20px;
}

.authbox {
    width:min(390px,100%);
    padding:28px;
    border-radius:25px;
    background:#151a36;
    border:1px solid #ffffff12;
    text-align:center;
}

.logo {
    font-size:32px;
    font-weight:bold;
    color:#8995ff;
    margin-bottom:10px;
}

.subtitle {
    color:#858ba2;
    font-size:12px;
    margin-bottom:20px;
}

.authbox input {
    width:100%;
    height:46px;
    border-radius:14px;
    margin-bottom:10px;
    direction:ltr;
}

.primary {
    width:100%;
    height:46px;
    border-radius:14px;
    background:linear-gradient(
        135deg,
        #667eea,
        #7650a9
    );
    font-weight:bold;
}

/* APP */

#app {
    display:none;
    height:100%;
}

.header {
    height:60px;
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:10px;
    background:#111630;
}

.headerLogo {
    color:#8995ff;
    font-size:22px;
}

.headerTitle {
    font-size:17px;
    font-weight:bold;
}

/* SEARCH */

.search {
    height:58px;
    padding:7px 12px;
    display:flex;
    gap:8px;
}

.search input {
    width:100%;
    height:44px;
    border-radius:24px;
}

/* PAGES */

.page {
    display:none;
    height:calc(100% - 118px);
    overflow:auto;
    padding-bottom:85px;
}

.page.active {
    display:block;
}

/* USER */

.userItem {
    margin:8px 12px;
    padding:11px;
    border-radius:23px;
    background:#181e3b;
    border:1px solid #ffffff0c;
    display:flex;
    align-items:center;
    gap:11px;
    cursor:pointer;
}

.avatar {
    width:50px;
    height:50px;
    border-radius:50%;
    flex:none;
    display:grid;
    place-items:center;
    overflow:hidden;
    background:linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );
    font-size:20px;
}

.avatar img {
    width:100%;
    height:100%;
    object-fit:cover;
}

.userInfo {
    min-width:0;
    flex:1;
}

.userName {
    font-weight:bold;
    display:flex;
    align-items:center;
    gap:4px;
}

.username {
    color:#8995ff;
    font-size:10px;
    margin-top:5px;
}

.status {
    color:#4ade80;
    font-size:9px;
    margin-top:4px;
}

.verify {
    display:inline-grid;
    place-items:center;
    width:16px;
    height:16px;
    border-radius:50%;
    background:#229ed9;
    font:bold 10px Arial;
}

/* EMPTY */

.empty {
    text-align:center;
    padding:100px 20px;
    color:#858ba2;
}

/* NAV */

.nav {
    position:fixed;
    z-index:10;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 20px);
    max-width:620px;
    height:68px;
    padding:5px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4px;
    border-radius:38px;
    background:#181e3bf5;
    border:1px solid #ffffff12;
    backdrop-filter:blur(18px);
}

.nav button {
    border-radius:30px;
    color:#747b94;
    font-size:10px;
}

.nav button.active {
    color:#fff;
    background:#ffffff12;
}

.nav b {
    display:block;
    font-size:19px;
    margin-bottom:3px;
}

/* CHAT */

#chat {
    display:none;
    height:100%;
    position:relative;
}

.chatHead {
    height:60px;
    display:flex;
    align-items:center;
    gap:9px;
    padding:5px 10px;
    background:#111630;
    border-bottom:1px solid #ffffff08;
}

.back {
    width:42px;
    height:42px;
    border-radius:50%;
    background:#ffffff08;
    font-size:26px;
}

.chatHead .avatar {
    width:45px;
    height:45px;
}

.chatUser {
    min-width:0;
    cursor:pointer;
}

.chatUser b {
    display:block;
    font-size:13px;
}

.chatUser span {
    display:block;
    margin-top:4px;
    color:#4ade80;
    font-size:9px;
}

#messages {
    height:calc(100% - 118px);
    overflow:auto;
    padding:10px 12px 20px;
}

.message {
    width:max-content;
    max-width:80%;
    padding:9px 12px;
    margin:5px 0;
    border-radius:15px 15px 4px 15px;
    background:#667eea;
    word-break:break-word;
    direction:rtl;
}

.message.mine {
    margin-right:0;
    margin-left:auto;
}

.message.theirs {
    margin-left:0;
    margin-right:auto;
    background:#252d50;
    border-radius:15px 15px 15px 4px;
}

.messageTime {
    display:block;
    margin-top:4px;
    font-size:8px;
    opacity:.55;
}

.sendbar {
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:58px;
    display:flex;
    gap:7px;
    padding:7px 10px;
    background:#111630;
}

.sendbar input {
    flex:1;
    height:44px;
    border-radius:24px;
}

.send {
    width:44px;
    height:44px;
    border-radius:50%;
    background:#667eea;
    font-size:18px;
}

/* PROFILE */

.profile {
    padding:25px 14px;
    text-align:center;
}

.bigAvatar {
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    display:grid;
    place-items:center;
    overflow:hidden;
    background:linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );
    font-size:40px;
}

.bigAvatar img {
    width:100%;
    height:100%;
    object-fit:cover;
}

.profileName {
    margin-top:12px;
    font-size:20px;
    font-weight:bold;
}

.profileUsername {
    margin-top:6px;
    color:#8995ff;
}

.card {
    max-width:500px;
    margin:20px auto;
    background:#181e3b;
    border-radius:20px;
    overflow:hidden;
    text-align:right;
}

.row {
    padding:14px;
    border-bottom:1px solid #ffffff08;
}

.row:last-child {
    border-bottom:0;
}

.label {
    color:#7d849d;
    font-size:9px;
}

.value {
    margin-top:5px;
}

.logout {
    width:100%;
    max-width:500px;
    height:44px;
    border-radius:20px;
    background:#ef44441a;
    color:#ff7373;
}

/* MODAL */

.modalBg {
    display:none;
    position:fixed;
    z-index:20;
    inset:0;
    background:#000b;
    padding:15px;
    align-items:center;
    justify-content:center;
}

.modal {
    width:min(430px,100%);
    max-height:90vh;
    overflow:auto;
    padding:22px;
    border-radius:24px;
    background:#151a36;
}

.modal h3 {
    margin-bottom:15px;
}

.modal input {
    width:100%;
    height:44px;
    border-radius:13px;
    margin-bottom:8px;
}

.close {
    width:100%;
    height:42px;
    border-radius:13px;
    margin-top:8px;
    background:#ffffff0b;
}

/* TOAST */

#toast {
    position:fixed;
    z-index:50;
    bottom:90px;
    left:50%;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    background:#1d2445ee;
    padding:10px 15px;
    border-radius:14px;
    font-size:11px;
    transition:.2s;
}

#toast.show {
    opacity:1;
    transform:translate(-50%,0);
}

</style>

</head>

<body>

<!-- AUTH -->

<div id="auth">

    <div class="authbox">

        <div class="logo">
            ⚡ Virax
        </div>

        <div class="subtitle">
            پیام‌رسان سریع و لحظه‌ای
        </div>

        <input
            id="phone"
            inputmode="numeric"
            maxlength="11"
            placeholder="09123456789"
        >

        <button
            class="primary"
            onclick="login()"
        >
            ورود / ثبت‌نام
        </button>

    </div>

</div>


<!-- APP -->

<div id="app">

    <header class="header">

        <span class="headerLogo">
            ⚡
        </span>

        <span
            class="headerTitle"
            id="headerTitle"
        >
            Virax
        </span>

    </header>


    <!-- SEARCH -->

    <div
        class="search"
        id="searchBox"
    >

        <input
            id="searchInput"
            placeholder="جستجوی کاربران با @username..."
        >

    </div>


    <!-- SEARCH RESULTS -->

    <section
        id="searchResults"
        class="page"
    ></section>


    <!-- CHATS -->

    <section
        id="chatsPage"
        class="page active"
    >

        <div class="empty">

            💬

            <br><br>

            برای شروع، از قسمت
            <b style="color:#fff">
                جستجو
            </b>
            یک کاربر پیدا کن.

        </div>

    </section>


    <!-- PROFILE -->

    <section
        id="profilePage"
        class="page"
    >

        <div class="profile">

            <div
                id="myAvatar"
                class="bigAvatar"
            >
                👤
            </div>

            <div
                id="myName"
                class="profileName"
            >
                کاربر Virax
            </div>

            <div
                id="myUsername"
                class="profileUsername"
            >
                @-
            </div>

            <div class="card">

                <div class="row">

                    <div class="label">
                        نام
                    </div>

                    <div
                        id="profileNameValue"
                        class="value"
                    ></div>

                </div>

                <div class="row">

                    <div class="label">
                        نام کاربری
                    </div>

                    <div
                        id="profileUsernameValue"
                        class="value"
                    ></div>

                </div>

                <div class="row">

                    <div class="label">
                        شماره
                    </div>

                    <div
                        id="profilePhone"
                        class="value"
                    ></div>

                </div>

            </div>

            <button
                class="primary"
                onclick="openEdit()"
            >
                ویرایش پروفایل
            </button>

            <button
                class="logout"
                style="margin-top:10px"
                onclick="logout()"
            >
                خروج
            </button>

        </div>

    </section>


    <!-- NAV -->

    <nav class="nav">

        <button
            id="navChats"
            class="active"
            onclick="showPage('chats')"
        >
            <b>💬</b>
            گفتگوها
        </button>

        <button
            id="navSearch"
            onclick="showPage('search')"
        >
            <b>🔎</b>
            جستجو
        </button>

        <button
            id="navProfile"
            onclick="showPage('profile')"
        >
            <b>👤</b>
            پروفایل
        </button>

    </nav>

</div>


<!-- CHAT -->

<section id="chat">

    <div class="chatHead">

        <button
            class="back"
            onclick="closeChat()"
        >
            ‹
        </button>

        <div
            id="chatAvatar"
            class="avatar"
        >
            👤
        </div>

        <div
            class="chatUser"
            onclick="showChatUser()"
        >

            <b id="chatName">
                کاربر
            </b>

            <span id="chatStatus">
                آفلاین
            </span>

        </div>

    </div>


    <div id="messages"></div>


    <div class="sendbar">

        <input
            id="messageInput"
            placeholder="پیام..."
            autocomplete="off"
        >

        <button
            class="send"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>

</section>


<!-- EDIT -->

<div
    id="editModal"
    class="modalBg"
>

    <div class="modal">

        <h3>
            ویرایش پروفایل
        </h3>

        <input
            id="editName"
            placeholder="نام"
        >

        <input
            id="editUsername"
            placeholder="username"
            dir="ltr"
        >

        <button
            class="primary"
            onclick="saveProfile()"
        >
            ذخیره
        </button>

        <button
            class="close"
            onclick="closeEdit()"
        >
            بستن
        </button>

    </div>

</div>


<!-- USER PROFILE -->

<div
    id="userModal"
    class="modalBg"
>

    <div class="modal profile">

        <div
            id="otherAvatar"
            class="bigAvatar"
        >
            👤
        </div>

        <div
            id="otherName"
            class="profileName"
        >
            کاربر
        </div>

        <div
            id="otherUsername"
            class="profileUsername"
        >
            @-
        </div>

        <div class="card">

            <div class="row">

                <div class="label">
                    وضعیت
                </div>

                <div
                    id="otherStatus"
                    class="value"
                >
                    آفلاین
                </div>

            </div>

            <div class="row">

                <div class="label">
                    نام کاربری
                </div>

                <div
                    id="otherUsername2"
                    class="value"
                >
                    -
                </div>

            </div>

        </div>

        <button
            class="close"
            onclick="closeUserModal()"
        >
            بستن
        </button>

    </div>

</div>


<div id="toast"></div>


<script src="/socket.io/socket.io.js"></script>

<script>

/*
|--------------------------------------------------------------------------
| Socket
|--------------------------------------------------------------------------
*/

const socket = io({
    transports: ["websocket", "polling"]
});


/*
|--------------------------------------------------------------------------
| State
|--------------------------------------------------------------------------
*/

let currentUser = null;
let currentChat = null;
let chatHistory = [];


/*
|--------------------------------------------------------------------------
| Helpers
|--------------------------------------------------------------------------
*/

const $ = id =>
    document.getElementById(id);

function toast(text) {

    const el = $("toast");

    el.textContent = text;

    el.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(() => {
            el.classList.remove("show");
        }, 2200);
}

function esc(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function avatarHTML(user) {

    if (user?.photo) {

        return `
            <img
                src="${user.photo}"
                alt=""
            >
        `;
    }

    return "👤";
}

function verifyHTML(user) {

    return user?.verified
        ? `<i class="verify">✓</i>`
        : "";
}


/*
|--------------------------------------------------------------------------
| Login
|--------------------------------------------------------------------------
*/

function login() {

    const value =
        $("phone")
            .value
            .replace(/\D/g, "");

    if (!/^09\d{9}$/.test(value)) {

        return toast(
            "شماره موبایل معتبر نیست"
        );
    }

    socket.emit(
        "login",
        {
            phone: value
        }
    );
}


/*
|--------------------------------------------------------------------------
| Login Success
|--------------------------------------------------------------------------
*/

socket.on(
    "login_success",
    ({ user }) => {

        currentUser = user;

        localStorage.setItem(
            "virax_phone",
            user.phone
        );

        $("auth").style.display =
            "none";

        $("app").style.display =
            "block";

        renderProfile();

        toast("وارد Virax شدید");
    }
);


/*
|--------------------------------------------------------------------------
| Auto Login
|--------------------------------------------------------------------------
*/

const savedPhone =
    localStorage.getItem(
        "virax_phone"
    );

if (savedPhone) {

    socket.emit(
        "login",
        {
            phone: savedPhone
        }
    );
}


/*
|--------------------------------------------------------------------------
| Errors
|--------------------------------------------------------------------------
*/

socket.on(
    "error_message",
    data => {
        toast(
            data?.message ||
            "خطایی رخ داد"
        );
    }
);


/*
|--------------------------------------------------------------------------
| Profile
|--------------------------------------------------------------------------
*/

function renderProfile() {

    if (!currentUser) {
        return;
    }

    $("myName").innerHTML =
        esc(currentUser.name);

    $("myUsername").textContent =
        currentUser.username
            ? "@" + currentUser.username
            : "@-";

    $("profileNameValue").textContent =
        currentUser.name;

    $("profileUsernameValue").textContent =
        currentUser.username
            ? "@" + currentUser.username
            : "تعیین نشده";

    $("profilePhone").textContent =
        currentUser.phone;

    $("myAvatar").innerHTML =
        avatarHTML(currentUser);
}


/*
|--------------------------------------------------------------------------
| Navigation
|--------------------------------------------------------------------------
*/

function showPage(page) {

    $("chat").style.display =
        "none";

    $("app").style.display =
        "block";

    document
        .querySelectorAll(".page")
        .forEach(x =>
            x.classList.remove("active")
        );

    document
        .querySelectorAll(".nav button")
        .forEach(x =>
            x.classList.remove("active")
        );

    $("searchBox").style.display =
        page === "search"
            ? "flex"
            : "none";

    if (page === "chats") {

        $("chatsPage")
            .classList.add("active");

        $("navChats")
            .classList.add("active");

        $("headerTitle")
            .textContent = "Virax";

    }

    if (page === "search") {

        $("searchResults")
            .classList.add("active");

        $("navSearch")
            .classList.add("active");

        $("headerTitle")
            .textContent = "جستجوی کاربران";

    }

    if (page === "profile") {

        $("profilePage")
            .classList.add("active");

        $("navProfile")
            .classList.add("active");

        $("headerTitle")
            .textContent = "پروفایل";

        renderProfile();
    }
}


/*
|--------------------------------------------------------------------------
| Search
|--------------------------------------------------------------------------
*/

let searchTimer;

$("searchInput").addEventListener(
    "input",
    () => {

        clearTimeout(searchTimer);

        const q =
            $("searchInput")
                .value
                .trim();

        searchTimer =
            setTimeout(() => {

                socket.emit(
                    "search_users",
                    q
                );

            }, 250);
    }
);


socket.on(
    "search_results",
    users => {

        const box =
            $("searchResults");

        if (!users.length) {

            box.innerHTML = `
                <div class="empty">
                    🔎
                    <br><br>
                    کاربری پیدا نشد
                </div>
            `;

            return;
        }

        box.innerHTML =
            users.map(user => {

                return `
                    <div
                        class="userItem"
                        onclick="openUser('${user.phone}')"
                    >

                        <div class="avatar">
                            ${avatarHTML(user)}
                        </div>

                        <div class="userInfo">

                            <div class="userName">
                                ${esc(user.name)}
                                ${verifyHTML(user)}
                            </div>

                            <div class="username">
                                ${
                                    user.username
                                        ? "@" + esc(user.username)
                                        : "@-"
                                }
                            </div>

                            <div class="status">
                                ${
                                    user.online
                                        ? "● آنلاین"
                                        : "○ آفلاین"
                                }
                            </div>

                        </div>

                    </div>
                `;

            }).join("");
    }
);


/*
|--------------------------------------------------------------------------
| Open User
|--------------------------------------------------------------------------
*/

function openUser(phone) {

    socket.emit(
        "get_user_by_phone",
        phone
    );

    /*
    | برای نسخه فعلی، کاربر را مستقیم باز می‌کنیم.
    */

    currentChat = {
        phone,
        name: "کاربر",
        username: "",
        photo: "",
        online: false
    };

    socket.emit(
        "open_chat",
        {
            phone
        }
    );

    showChat();
}


/*
|--------------------------------------------------------------------------
| Chat History
|--------------------------------------------------------------------------
*/

socket.on(
    "chat_history",
    ({ phone, messages }) => {

        if (
            !currentChat ||
            currentChat.phone !== phone
        ) {
            return;
        }

        chatHistory = messages || [];

        renderMessages();
    }
);


/*
|--------------------------------------------------------------------------
| Show Chat
|--------------------------------------------------------------------------
*/

function showChat() {

    $("app").style.display =
        "none";

    $("chat").style.display =
        "block";

    $("messages").innerHTML = "";

    $("messageInput").focus();
}


/*
|--------------------------------------------------------------------------
| Close Chat
|--------------------------------------------------------------------------
*/

function closeChat() {

    currentChat = null;

    $("chat").style.display =
        "none";

    $("app").style.display =
        "block";

    showPage("chats");
}


/*
|--------------------------------------------------------------------------
| Incoming Messages
|--------------------------------------------------------------------------
*/

socket.on(
    "new_message",
    message => {

        if (!currentChat) {
            return;
        }

        const belongs =
            (
                message.from ===
                currentUser.phone &&
                message.to ===
                currentChat.phone
            ) ||
            (
                message.to ===
                currentUser.phone &&
                message.from ===
                currentChat.phone
            );

        if (!belongs) {
            return;
        }

        chatHistory.push(message);

        renderMessages();
    }
);


/*
|--------------------------------------------------------------------------
| Render Messages
|--------------------------------------------------------------------------
*/

function renderMessages() {

    const box =
        $("messages");

    box.innerHTML =
        chatHistory
            .map(message => {

                const mine =
                    message.from ===
                    currentUser.phone;

                const time =
                    new Date(
                        message.time
                    ).toLocaleTimeString(
                        "fa-IR",
                        {
                            hour:"2-digit",
                            minute:"2-digit"
                        }
                    );

                return `
                    <div
                        class="message ${
                            mine
                                ? "mine"
                                : "theirs"
                        }"
                    >

                        ${esc(message.message)}

                        <span class="messageTime">
                            ${time}
                        </span>

                    </div>
                `;

            })
            .join("");

    box.scrollTop =
        box.scrollHeight;
}


/*
|--------------------------------------------------------------------------
| Send Message
|--------------------------------------------------------------------------
*/

function sendMessage() {

    if (!currentChat) {
        return;
    }

    const input =
        $("messageInput");

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    socket.emit(
        "send_message",
        {
            to: currentChat.phone,
            message: text
        }
    );

    input.value = "";

    input.focus();
}


$("messageInput").addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();
        }
    }
);


/*
|--------------------------------------------------------------------------
| Presence
|--------------------------------------------------------------------------
*/

socket.on(
    "presence",
    ({ phone, online }) => {

        if (
            currentChat &&
            currentChat.phone === phone
        ) {

            $("chatStatus").textContent =
                online
                    ? "● آنلاین"
                    : "○ آفلاین";
        }
    }
);


/*
|--------------------------------------------------------------------------
| User Profile
|--------------------------------------------------------------------------
*/

function showChatUser() {

    if (!currentChat) {
        return;
    }

    $("otherName").textContent =
        currentChat.name;

    $("otherUsername").textContent =
        currentChat.username
            ? "@" + currentChat.username
            : "@-";

    $("otherUsername2").textContent =
        currentChat.username
            ? "@" + currentChat.username
            : "-";

    $("otherStatus").textContent =
        currentChat.online
            ? "● آنلاین"
            : "○ آفلاین";

    $("otherAvatar").innerHTML =
        avatarHTML(currentChat);

    $("userModal").style.display =
        "flex";
}

function closeUserModal() {

    $("userModal").style.display =
        "none";
}


/*
|--------------------------------------------------------------------------
| Edit Profile
|--------------------------------------------------------------------------
*/

function openEdit() {

    $("editName").value =
        currentUser?.name || "";

    $("editUsername").value =
        currentUser?.username || "";

    $("editModal").style.display =
        "flex";
}

function closeEdit() {

    $("editModal").style.display =
        "none";
}

function saveProfile() {

    const name =
        $("editName")
            .value
            .trim();

    const username =
        $("editUsername")
            .value
            .trim()
            .replace(/^@/, "");

    if (!name) {
        return toast(
            "نام را وارد کنید"
        );
    }

    if (!/^[a-zA-Z0-9_]{3,24}$/.test(username)) {
        return toast(
            "نام کاربری باید ۳ تا ۲۴ کاراکتر باشد"
        );
    }

    socket.emit(
        "update_profile",
        {
            name,
            username
        }
    );
}


socket.on(
    "profile_updated",
    ({ user }) => {

        currentUser = user;

        renderProfile();

        closeEdit();

        toast(
            "پروفایل ذخیره شد"
        );
    }
);


/*
|--------------------------------------------------------------------------
| Logout
|--------------------------------------------------------------------------
*/

function logout() {

    localStorage.removeItem(
        "virax_phone"
    );

    location.reload();
}


/*
|--------------------------------------------------------------------------
| User Updated
|--------------------------------------------------------------------------
*/

socket.on(
    "user_updated",
    ({ user }) => {

        if (
            currentChat &&
            currentChat.phone === user.phone
        ) {

            currentChat = user;

            $("chatName").innerHTML =
                esc(user.name);

            $("chatAvatar").innerHTML =
                avatarHTML(user);

            $("chatStatus").textContent =
                user.online
                    ? "● آنلاین"
                    : "○ آفلاین";
        }
    }
);


/*
|--------------------------------------------------------------------------
| Get User By Phone
|--------------------------------------------------------------------------
|
| این رویداد را هم روی سرور پشتیبانی می‌کنیم.
|--------------------------------------------------------------------------
*/

socket.on(
    "user_result",
    user => {

        if (!user) {
            return;
        }

        if (
            currentChat &&
            currentChat.phone === user.phone
        ) {

            currentChat = user;

            $("chatName").innerHTML =
                esc(user.name);

            $("chatAvatar").innerHTML =
                avatarHTML(user);

            $("chatStatus").textContent =
                user.online
                    ? "● آنلاین"
                    : "○ آفلاین";
        }
    }
);

</script>
